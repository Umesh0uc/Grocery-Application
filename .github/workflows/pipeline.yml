name: Build and Deploy

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code 
                uses: actions/checkout@v4
                with:
                    ref: develop
            
            -   name: Set up Node.js
                uses: actions/setup-node@v3
                with:
                    node-version: '20'

            -   name: Install dependencies
                working-directory: ./mygrocery
                run: npm install
                
            -   name: Build
                working-directory: ./mygrocery
                run: npm run build
                
            -   name: Deploy to EC2
                uses: appleboy/scp-action@v0.1.7
                with:
                    host: ${{ secrets.EC2_HOST }}
                    username: ${{ secrets.EC2_USERNAME }}
                    key: ${{ secrets.EC2_SSH_KEY }}
                    source: "./mygrocery/dist,./mygrocery/server.js"
                    target: "/home/ec2-user/my-vite-app"
                    strip_components: 1

            -   name: Start/Restart Node Server
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host: ${{ secrets.EC2_HOST }}
                    username: ${{ secrets.EC2_USERNAME }}
                    key: ${{ secrets.EC2_SSH_KEY }}
                    script: |
                        # Navigate to the deployment folder
                        cd /home/ec2-user/my-vite-app

                        sudo npm init -y
                        
                        # Ensure PM2 is installed globally (PM2 keeps the server running in the background)
                        sudo npm install -g express pm2
                        
                        # Restart the server if it's already running, otherwise start it for the first time
                        pm2 restart "my-react-app" || pm2 start server.js --name "my-react-app"